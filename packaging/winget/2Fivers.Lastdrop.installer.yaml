# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# The release's Lastdrop-Setup.exe is the app itself: --install --quiet installs it for the
# current user without questions or message boxes, and the "Installed apps" entry (ProductCode
# Lastdrop) has a QuietUninstallString (updates-spec §2).
PackageIdentifier: 2Fivers.Lastdrop
PackageVersion: {{VERSION}}
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.22000.0
InstallerType: exe
Scope: user
InstallModes:
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: --install --quiet
  SilentWithProgress: --install --quiet
UpgradeBehavior: install
ReleaseDate: {{DATE}}
AppsAndFeaturesEntries:
  - DisplayName: Lastdrop
    Publisher: 2Fivers
    ProductCode: Lastdrop
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/2Fivers/lastdrop/releases/download/v{{VERSION}}/Lastdrop-Setup.exe
    InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.12.0
