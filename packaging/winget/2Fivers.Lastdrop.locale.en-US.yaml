ShortDescription: How much AI is left in the tank, one click away.
Description: |-
  Lastdrop is a Windows 11 tray app that shows your remaining usage across AI services without
  opening each service's usage page: what is left, when it resets, what you used recently and
  whether your current pace will last until the next reset.

  It reuses the sign-ins of the tools you already have (Claude Code, Codex, the GitHub CLI,
  Cursor and others) and sends each one only to that service's own usage API. Apart from a daily
  update check against GitHub, which can be turned off, nothing else leaves your PC: no
  telemetry, and the history and settings stay local.
