"card.sentence.paused.open" = "L'actualisation est suspendue. Voici les chiffres du dernier relevé ({time})."
# The tick line shares its row with the forecast, the reset line with `card.line.in`, and
# `card.line.reset` is also the flyout row's right cluster beside the meter name and the
# percent: so `réinit.` there, and the forecasts speak of the end of the period (`en fin de
# période`, `jusqu'au bout`) rather than end on an abbreviation's full stop.
"card.line.elapsed" = "{e} du temps écoulé"
"card.line.elapsed.stale" = "{e} du temps écoulé ({time})"
"card.line.elapsed.unknown" = "temps écoulé inconnu"
