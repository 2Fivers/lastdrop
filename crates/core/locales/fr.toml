"card.title.critical.level" = "{meter} utilisé à {pct}"
"card.title.exhausted" = "{meter} épuisé jusqu'à {time}"
"card.title.balance.warning" = "{meter} épuisé vers {time}"
"card.title.balance.runway" = "{meter} épuisé dans {duration}"
"card.title.balance.empty" = "{meter} épuisé"
