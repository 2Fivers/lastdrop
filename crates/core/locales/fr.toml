# say `{left} {window}` (`28 % du quota de la semaine`).
"card.window.session" = "du quota de la session"
"card.window.week" = "du quota de la semaine"
"card.window.month" = "du quota du mois"
# `l'` and `il` stand for the meter the title names; every short_name is masculine.
"card.sentence.warning" = "Vous l'utilisez plus vite que le temps ne passe\u00A0: {pct} utilisé pour {e} de la période écoulée. Au rythme constaté depuis {span}, il sera épuisé {duration} avant la réinitialisation ({time})."
"card.sentence.warning.course" = "Vous l'utilisez plus vite que le temps ne passe\u00A0: {pct} utilisé pour {e} de la période écoulée. Au rythme constaté depuis {span}, il atteindra environ {p} à la réinitialisation ({time})."
# Mid-sentence, so `côté {other}` rather than an article that would need the name's gender.
"card.sentence.other" = " Côté {other}, tout va bien."
"card.sentence.critical" = "{pct} utilisé. Au rythme constaté depuis {span}, il sera épuisé vers {time}, {duration} avant la réinitialisation ({reset})."
"card.sentence.level" = "Presque épuisé. À votre rythme récent, il tiendra jusqu'à la réinitialisation ({time})."
"card.sentence.exhausted" = "Épuisé (depuis {since}). Il sera de nouveau disponible dans {duration} ({time})."
"card.sentence.exhausted.nosince" = "Épuisé. Il sera de nouveau disponible dans {duration} ({time})."
