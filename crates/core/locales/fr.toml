"card.sentence.ok.n.mixed" = "À votre rythme récent, il restera environ {left} à leur réinitialisation."
"card.sentence.ok.1.pace.under" = "L'utilisation progresse moins vite que le temps."
"card.sentence.ok.1.pace.about" = "L'utilisation progresse à peu près au même rythme que le temps."
"card.sentence.ok.1.pace.ahead" = "L'utilisation progresse plus vite que le temps."
"card.sentence.ok.n.pace" = "Pour tous les quotas, l'utilisation progresse moins vite que le temps."
"card.sentence.ok.1.left" = "À votre rythme récent, il restera environ {left} {window} à la réinitialisation."
"card.title.ok.noreset" = "Vous restez dans vos quotas"
