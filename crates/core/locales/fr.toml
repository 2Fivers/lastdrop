"card.sentence.ok.1" = "L'utilisation progresse moins vite que le temps. À votre rythme récent, il restera environ {left} {window} à la réinitialisation."
"card.sentence.ok.n" = "Pour tous les quotas, l'utilisation progresse moins vite que le temps. À votre rythme récent, il restera environ {left} à leur réinitialisation."
