# Lastdrop's French strings. en.toml is the source; README.md next to this file has the rules.
#
# Conventions in this file:
# - "limit" is `quota` (masculine) throughout; a balance is a `solde`, a top-up a `recharge`, a
#   reset a `réinitialisation`, a reading a `relevé`, the pace the `rythme`, the flyout the
#   `panneau`, the readout `l'affichage dans la barre des tâches`, a meter a `compteur`, a
#   window a `période`. "Updates" of the numbers are `actualisation`, so that `mises à jour`
#   only ever means updates of Lastdrop itself.
# - `{time}` and its kin may be a clock time, `auj. 18:00`, `lun. 09:00` or
#   `dim. 1 nov.`, so no template puts `à` before them; `vers`, `jusqu'à`, `depuis`, `avant`, a
#   colon or parentheses fit all four. No template says `de {service}` either: Antigravity
#   and OpenCode would need the elided `d'`.
# - A no-break space (`\u00A0`) precedes every `:` and `?`, as French typography wants.

[language]
name = "Français"
english_name = "French"
plural = "zero-one"
lowercase_names = true

[strings]
# ---- Readout tokens (R§5.1–R§5.5)
"reason.offline" = "Hors ligne"
"reason.signin" = "Connexion"
"reason.paused" = "En pause"
# `Injoignable` rather than `Aucune donnée`: every readout width is measured with it, and the
# card and the flyout say that the service does not answer.
"reason.nodata" = "Injoignable"
"reason.oldreading" = "Aucune nouvelle donnée"
"loading" = "Lecture…"
# Abbreviated like the weekdays it stands with (`↺auj.`, `↺lun.`): every readout width is
# measured with it, so `aujourd'hui` would take room from the bars for good. Lower-case, as in
# card times (`auj. 18:00`) and running text.
"today" = "auj."
"out" = "Fin {time}"
"back" = "Retour {time}"
"empty" = "Vide"
# A no-break space joins each number to its unit (`12\u00A0min`), so a line never breaks
# between them.
"countdown.min" = "Reste {n}\u00A0min"
"countdown.h" = "Reste {n}\u00A0h"
"countdown.d" = "Reste {n}\u00A0j"
"countdown.compact.min" = "{n}\u00A0min"
"countdown.compact.h" = "{n}\u00A0h"
"countdown.compact.d" = "{n}\u00A0j"
"noreset" = "–"
# Compact units like the other tokens: m, h, j (jours), sem (semaines).
"age.m" = "il y a {n}m"
"age.h" = "il y a {n}h"
"age.d" = "il y a {n}j"
"token.days" = "{n}j"
"token.rel.m" = "{n}m"
"token.rel.h" = "{n}h"
"token.rel.d" = "{n}j"
"balance.approx" = "≈"
"balance.h" = "{n}h"
"balance.d" = "{n}j"
"balance.w" = "{n}sem"
"balance.max" = "9sem+"

# ---- Long durations (R§5.0)
"duration.min" = "{n}\u00A0min"
"duration.h" = "{h}\u00A0h"
"duration.hmin" = "{h}\u00A0h {m}\u00A0min"
"duration.d" = "{d}\u00A0j"
"duration.dh" = "{d}\u00A0j {h}\u00A0h"

# ---- Spoken units with plurals (zero-one: 0 and 1 take the singular)
"unit.minute" = { one = "{n} minute", other = "{n} minutes" }
"unit.hour" = { one = "{n} heure", other = "{n} heures" }
"unit.day" = { one = "{n} jour", other = "{n} jours" }
"unit.week" = { one = "{n} semaine", other = "{n} semaines" }
"unit.credits" = { one = "crédit", other = "crédits" }

