# Lastdrop's Spanish strings. en.toml is the source; README.md next to this file has the rules.
#
# Neutral Spanish for Spain and Latin America, "tú" as Windows 11 uses it, and Windows' own terms
# (barra de tareas, área de notificación, No molestar, Administrador de credenciales, Mayús).
# Card times (`{time}`, `{reset}`, `{since}`, `{until}`, `{next}`) take no preposition: `a las`
# would break `lu. 9:00` and `hoy 18:00`. They stand bare (`se agota 15:18`, as Swedish does),
# after `hasta`, `desde`, `≈` or a colon, or in parentheses (`antes del restablecimiento (16:30)`).

[language]
name = "Español"
english_name = "Spanish"
plural = "one"
lowercase_names = true

[strings]
# ---- Readout tokens (R§5.1–R§5.5)
# The readout's short form of `Sin conexión` (used everywhere else).
"reason.offline" = "Sin red"
"reason.signin" = "Sin sesión"
"reason.paused" = "En pausa"
"reason.nodata" = "Sin datos"
"reason.oldreading" = "Sin datos nuevos"
"loading" = "Leyendo…"
# Lower-case like the es-ES weekday abbreviations it stands with (`↺hoy`, `↺lu.`).
"today" = "hoy"
# `Fin` = the limit runs out; the countdown says the same (`Fin en 12 min`), which also avoids
# `Quedan 1 min`.
"out" = "Fin {time}"
"back" = "Vuelve {time}"
"empty" = "Agotado"
# A no-break space joins each number to its unit (`12\u00A0min`), so a line never breaks
# between them.
"countdown.min" = "Fin en {n}\u00A0min"
"countdown.h" = "Fin en {n}\u00A0h"
"countdown.d" = "Fin en {n}\u00A0d"
"countdown.compact.min" = "{n}\u00A0min"
"countdown.compact.h" = "{n}\u00A0h"
"countdown.compact.d" = "{n}\u00A0d"
"noreset" = "–"
"age.m" = "hace {n}m"
"age.h" = "hace {n}h"
"age.d" = "hace {n}d"
"token.days" = "{n}d"
"token.rel.m" = "{n}m"
"token.rel.h" = "{n}h"
"token.rel.d" = "{n}d"
"balance.approx" = "≈"
"balance.h" = "{n}h"
"balance.d" = "{n}d"
# `s` would read as seconds.
"balance.w" = "{n}sem"
"balance.max" = "9sem+"

# ---- Long durations (R§5.0)
"duration.min" = "{n}\u00A0min"
"duration.h" = "{h}\u00A0h"
"duration.hmin" = "{h}\u00A0h {m}\u00A0min"
"duration.d" = "{d}\u00A0d"
"duration.dh" = "{d}\u00A0d {h}\u00A0h"

# ---- Spoken units with plurals
"unit.minute" = { one = "{n} minuto", other = "{n} minutos" }
"unit.hour" = { one = "{n} hora", other = "{n} horas" }
"unit.day" = { one = "{n} día", other = "{n} días" }
"unit.week" = { one = "{n} semana", other = "{n} semanas" }
# Balances say `saldo de {amount} {unit}` instead of `Quedan`, which would need
# `Queda 1 crédito`.
"unit.credits" = { one = "crédito", other = "créditos" }

# ---- Hover card (R§8.2)
"card.title.ok.1" = "Llegarás al restablecimiento"
"card.title.ok.2" = "Llegarás a ambos restablecimientos"
"card.title.ok.n" = "Llegarás a todos los restablecimientos"
