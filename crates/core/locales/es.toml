# `{span}` is 30 min, 1 h, 16 h 48 min or 1 d: `desde hace {span}` fits each, where
# `los últimos {span}` would need its gender and number.
"card.sentence.warning" = "Lo estás usando más rápido de lo que pasa el tiempo: has usado el {pct} y ha pasado el {e} del período. Al ritmo que llevas desde hace {span}, se agota {duration} antes del restablecimiento ({time})."
