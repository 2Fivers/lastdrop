# Lastdrop's German strings. en.toml is the source; README.md next to this file has the rules.

[language]
name = "Deutsch"
english_name = "German"
plural = "one"
lowercase_names = false

[strings]
# ---- Readout tokens (R§5.1–R§5.5)
# Units are the SI symbols (min, h, d), as short as the English ones. `Wo` = Woche.
"reason.offline" = "Offline"
"reason.signin" = "Anmelden"
"reason.paused" = "Pausiert"
"reason.nodata" = "Keine Daten"
"reason.oldreading" = "Keine neuen Daten"
"loading" = "Lädt…"
# Lower-case as German writes it mid-sentence (`↺heute`, `heute 18:00`, next to `↺Mo`).
"today" = "heute"
# `Leer 15:20`: empty at that time; the readout says `Leer` when it is empty now.
"out" = "Leer {time}"
"back" = "Zurück {time}"
"empty" = "Leer"
# A no-break space joins each number to its unit (`12\u00A0min`), so a line never breaks
# between them.
"countdown.min" = "Noch {n}\u00A0min"
"countdown.h" = "Noch {n}\u00A0h"
"countdown.d" = "Noch {n}\u00A0d"
"countdown.compact.min" = "{n}\u00A0min"
"countdown.compact.h" = "{n}\u00A0h"
"countdown.compact.d" = "{n}\u00A0d"
"noreset" = "–"
"age.m" = "vor {n}m"
"age.h" = "vor {n}h"
"age.d" = "vor {n}d"
"token.days" = "{n}d"
"token.rel.m" = "{n}m"
"token.rel.h" = "{n}h"
"token.rel.d" = "{n}d"
"balance.approx" = "≈"
"balance.h" = "{n}h"
"balance.d" = "{n}d"
"balance.w" = "{n}Wo"
"balance.max" = "9Wo+"

# ---- Long durations (R§5.0)
"duration.min" = "{n}\u00A0min"
"duration.h" = "{h}\u00A0h"
"duration.hmin" = "{h}\u00A0h {m}\u00A0min"
"duration.d" = "{d}\u00A0d"
"duration.dh" = "{d}\u00A0d {h}\u00A0h"

# ---- Spoken units with plurals
# Nominative/accusative (`3 Tage`), as the card's `≈ 9 Tage` needs. No template puts a dative
# preposition (vor, in, seit) before a spoken duration, which would want `Tagen`.
"unit.minute" = { one = "{n} Minute", other = "{n} Minuten" }
"unit.hour" = { one = "{n} Stunde", other = "{n} Stunden" }
"unit.day" = { one = "{n} Tag", other = "{n} Tage" }
"unit.week" = { one = "{n} Woche", other = "{n} Wochen" }
"unit.credits" = { one = "Credit", other = "Credits" }

# ---- Hover card (R§8.2)
# Reset is `Zurücksetzung` (Microsoft's noun, as in Kennwortzurücksetzung), the verb
# `zurücksetzen`. A card time can be `15:18`, `heute 18:00`, `Mo 09:00` or `So 1 Nov`, so it
# never follows `um`/`am`: it takes `bis`, `ab`, `seit`, `von`, no preposition, or parentheses
# after `der Zurücksetzung`.
"card.title.ok.1" = "Reicht bis zur Zurücksetzung"
"card.title.ok.2" = "Reicht bis zu beiden Zurücksetzungen"
"card.title.ok.n" = "Reicht bis zu allen Zurücksetzungen"
"card.title.warning" = "{meter} reicht nur bis {time}"
# `{service}: {meter}` as in `card.also.line`.
"card.title.warning.service" = "{service}: {meter} reicht nur bis {time}"
"card.title.warning.course" = "{meter} auf dem Weg zu {p} bei der Zurücksetzung"
"card.title.warning.course.service" = "{service}: {meter} auf dem Weg zu {p} bei der Zurücksetzung"
"card.title.critical.runway" = "{meter} reicht nur noch {duration}"
# Also a balance's title (`Credit-Guthaben zu 92 % verbraucht`).
"card.title.critical.level" = "{meter} zu {pct} verbraucht"
# "aufgebraucht bis" reads as "until", like "geschlossen bis Montag".
"card.title.exhausted" = "{meter} aufgebraucht bis {time}"
"card.title.balance.warning" = "{meter} reicht nur bis {time}"
"card.title.balance.runway" = "{meter} reicht nur noch {duration}"
"card.title.balance.empty" = "{meter} aufgebraucht"
"card.title.stale" = "Seit {age} keine neue Messung von {service}"
"card.title.signin" = "{service} erfordert eine erneute Anmeldung"
"card.title.apikey" = "{service} benötigt einen API-Schlüssel"
"card.sentence.apikey" = "Lastdrop hat keinen funktionierenden API-Schlüssel für {service}. Wählen Sie die Taskleistenanzeige aus und dann „Schlüssel eingeben…“, um einen hinzuzufügen."
# "Das Limit" rather than "es": the meter may be feminine (`Enthaltene Nutzung`).
"card.sentence.ok.1" = "Das Limit wird langsamer verbraucht, als die Zeit vergeht. Bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left} {window}."
"card.sentence.ok.n" = "Alle Limits werden langsamer verbraucht, als die Zeit vergeht. Bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left}."
"card.sentence.ok.1.about" = "Das Limit wird etwa so schnell verbraucht, wie die Zeit vergeht. Bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left} {window}."
"card.sentence.ok.1.ahead" = "Das Limit wird schneller verbraucht, als die Zeit vergeht, aber bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left} {window}."
"card.sentence.ok.n.mixed" = "Bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left}."
"card.sentence.ok.1.pace.under" = "Das Limit wird langsamer verbraucht, als die Zeit vergeht."
"card.sentence.ok.1.pace.about" = "Das Limit wird etwa so schnell verbraucht, wie die Zeit vergeht."
"card.sentence.ok.1.pace.ahead" = "Das Limit wird schneller verbraucht, als die Zeit vergeht."
"card.sentence.ok.n.pace" = "Alle Limits werden langsamer verbraucht, als die Zeit vergeht."
"card.sentence.ok.1.left" = "Bei Ihrem aktuellen Tempo beträgt der Rest bei der Zurücksetzung etwa {left} {window}."
"card.title.ok.noreset" = "Innerhalb Ihrer Limits"
# Genitive, as filled into `beträgt der Rest … etwa {left} {window}` ("about 58 % of the weekly
# limit"); `der Rest beträgt` agrees with any share, also `1 %`.
"card.window.session" = "des Sitzungslimits"
"card.window.week" = "des Wochenlimits"
"card.window.month" = "des Monatslimits"
"card.sentence.warning" = "Sie verbrauchen das Limit schneller, als die Zeit vergeht: {pct} verbraucht, {e} des Zeitfensters vergangen. Im Tempo der letzten {span} ist es {duration} vor der Zurücksetzung ({time}) aufgebraucht."
"card.sentence.warning.course" = "Sie verbrauchen das Limit schneller, als die Zeit vergeht: {pct} verbraucht, {e} des Zeitfensters vergangen. Im Tempo der letzten {span} erreicht es bis zur Zurücksetzung ({time}) etwa {p}."
# No article before `{other}` (its gender varies): headline style after the colon.
"card.sentence.other" = " {other}: alles in Ordnung."
"card.sentence.critical" = "{pct} verbraucht. Im Tempo der letzten {span} ist das Limit bis etwa {time} aufgebraucht, {duration} vor der Zurücksetzung ({reset})."
"card.sentence.level" = "Fast aufgebraucht. Bei Ihrem aktuellen Tempo reicht das Limit bis zur Zurücksetzung ({time})."
"card.sentence.exhausted" = "Seit {since} aufgebraucht. Wieder verfügbar ab {time}, in {duration}."
"card.sentence.exhausted.nosince" = "Aufgebraucht. Wieder verfügbar ab {time}, in {duration}."
"card.sentence.offline" = "Lastdrop ist offline, daher sind dies die Werte von {time}. Die Balken sind gestrichelt und auf diesem Stand eingefroren, bis eine neue Messung eintrifft. Nächster Versuch: {next}."
"card.sentence.nodata" = "{service} antwortet nicht ({detail}), daher sind dies die Werte von {time}. Nächster Versuch: {next}."
"card.sentence.oldreading" = "{service} antwortet, aber die neuesten Werte sind von {time}. Nächster Versuch: {next}."
"card.sentence.signin" = "Die Anmeldung bei {service} ist abgelaufen. Lastdrop meldet Sie nie selbst an: Öffnen Sie {client} mit diesem Konto, um sie zu erneuern. Wählen Sie die Taskleistenanzeige aus, um die Schritte zu sehen."
# Updates of the readings are `Aktualisierung`; `Updates` are new versions of Lastdrop.
"card.sentence.paused" = "Die Aktualisierung ist bis {until} pausiert. Dies sind die Werte von {time}."
"card.sentence.paused.open" = "Die Aktualisierung ist pausiert. Dies sind die Werte von {time}."
# The card's tick line shares its row with the forecast: short forms.
"card.line.elapsed" = "{e} der Zeit vergangen"
"card.line.elapsed.stale" = "{e} der Zeit vergangen, Stand {time}"
"card.line.elapsed.unknown" = "vergangene Zeit unbekannt"
"card.line.forecast.course" = "≈ {p} bei Zurücksetzung"
"card.line.forecast.lasts" = "reicht bis zur Zurücksetzung"
"card.line.forecast.none" = "noch keine Prognose"
"card.line.forecast.runsout" = "leer ≈ {time}"
"card.line.forecast.usedup" = "aufgebraucht"
"card.line.reset" = "Zurücksetzung {time}"
"card.line.in" = "in {duration}"
"card.line.idle" = "Beginnt mit Ihrer nächsten Nutzung"
"card.line.notstarted" = "Zeitfenster noch nicht begonnen"
"card.line.noreset" = "Keine Zurücksetzungszeit angegeben"
"card.line.nolength" = "Länge des Zeitfensters unbekannt"
"card.line.justreset" = "Zurückgesetzt {time} · erste Messung ausstehend"
# "bis" with a finished state reads as "by" (`Bis 17:42 beendet`).
"card.line.ended" = "Bis {time} beendet"
"card.value" = "{pct} verbraucht"
"card.balance.value" = "{pct} der Aufladung verbraucht"
"card.balance.left" = "{amount} von {ref}\u00A0{unit} übrig"
"card.balance.rate" = "{burn} pro Tag, letzte 7 Tage"
"card.balance.forecast.lasts" = "reicht ≈ {duration}"
"card.balance.forecast.runsout" = "leer ≈ {time}"
"card.balance.forecast.empty" = "leer"
"card.balance.forecast.nouse" = "seit 7\u00A0Tagen ungenutzt"
"card.balance.forecast.nohistory" = "noch zu wenige Verlaufsdaten"
"card.balance.until" = "bis ≈ {date}"
"card.age" = "Aktualisiert {age}"
"card.age.stale" = "Letzte Messung {time}"
"card.also" = "Ebenfalls überwacht"
"card.also.more" = "+{n} weitere"
# Headline style, service first, like the stale and sign-in verdicts (`Claude: erneut
# anmelden`): `Claude: Wochenlimit`, `Meshy: Credit-Guthaben`. Templates that take `{label}`
# (or a `{meter}` that may be this line) therefore never add a second colon after it.
"card.also.line" = "{service}: {short_name}"

