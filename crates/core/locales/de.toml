# ---- Meter names (R§2): `short_name` is a whole noun phrase with "Limit" in it, or the
# balance by what it is (`Credit-Guthaben`). Every short_name is singular and starts with a
# capital or a digit; no template puts an article or a gendered word next to `{meter}`,
# `{label}`, `{other}` or `{short_name}`, and they only stand at the start of a title or after
# a colon. Labels avoid the weekday abbreviations Mo Di Mi Do Fr Sa So.
