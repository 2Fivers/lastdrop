# Lastdrop's English strings: the source every other language is checked against.
#
# To add a language, copy this file to `<tag>.toml` (`de.toml`, `pt-BR.toml`), fill in
# [language] and translate every string under [strings]. The build checks every file: each key
# here must be there with the same {placeholders}, and each plural string needs exactly the
# forms of the language's plural rule. README.md next to this file has the rules.

[language]
# The language's name in itself, as the language picker shows it.
name = "English"
# The language's name in English: the name of its `Language` in the code.
english_name = "English"
# How a count picks its plural form (README.md): "one" = only 1 is singular.
plural = "one"
# Meter names start lower-case inside a sentence ("weekly, all models").
lowercase_names = true

