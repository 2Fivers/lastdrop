[package]
name = "lastdrop"
description = "Lastdrop: how much AI is left in the tank, one click away. Windows 11 tray app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# The app's modules are a library so every public item is documented and unit-testable; the
# binary is a thin `main`.
[lib]
name = "lastdrop_app"
path = "src/lib.rs"

[[bin]]
name = "lastdrop"
path = "src/main.rs"

[dependencies]
lastdrop-core.workspace = true
lastdrop-providers.workspace = true
lastdrop-win.workspace = true
log.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
thiserror.workspace = true
# The binary reads the system time zone; Windows has no IANA tzdb, so it is bundled.
jiff = { workspace = true, features = ["tz-system", "tz-fat", "tzdb-bundle-platform"] }

[dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true
