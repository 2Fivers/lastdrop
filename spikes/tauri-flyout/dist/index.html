<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lastdrop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="flyout" id="flyout">
  <header class="hdr">
    <div class="hdr-text">
      <span class="app-title">Lastdrop</span>
      <span class="updated" id="updated">Updated 2 min ago</span>
    </div>
    <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh"><span class="glyph" aria-hidden="true">&#xE72C;</span></button>
  </header>
  <main class="content" id="content"></main>
  <footer class="ftr">
    <button class="subtle-btn" id="settings" type="button"><span class="glyph" aria-hidden="true">&#xE713;</span><span>Settings</span></button>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
