name: ci

# The quality bar of docs/ARCHITECTURE.md: fmt, clippy with every warning an error, the whole
# test suite and the release binary, on Windows (the only platform Lastdrop runs on), and
# cargo-deny over the dependency graph (deny.toml). Dependency review and CodeQL have their
# own workflows (dependency-review.yml, codeql.yml).
# Dependency updates come from the organisation's shared Renovate preset (renovate.json), not
# from a bot configured here.
#
# Pull requests get the quick checks (fmt, clippy, test, cargo-deny). The release build (fat
# LTO, one codegen unit: about 9 minutes) runs on main, weekly and by hand. The weekly run also
# catches new RustSec advisories in an unchanged tree and keeps main's caches from expiring
# (GitHub evicts a cache that has not been read for 7 days). Only main saves caches; pull
# requests restore main's.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and lists rustfmt and clippy; with no toolchain
      # named, rustup installs exactly that.
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Live smoke tests (a real codex app-server) are #[ignore]d and do not run here.
      - name: Test
        run: cargo test --workspace --locked

  release:
    name: release build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      # A cache of its own (the job id is part of the key): release artefacts only.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release build
        run: cargo build --release -p lastdrop --locked

  # Supply chain (deny.toml): RustSec advisories, licences, duplicate versions, sources.
  deny:
    name: cargo-deny
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # cargo-deny reads the graph through `cargo metadata`, which wants the pinned toolchain.
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      # A prebuilt, checksum-verified binary of exactly this version.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --locked check
