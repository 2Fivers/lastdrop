name: release

# Builds a release in the browser (docs/RELEASING.md, updates-spec §4): Actions ▸ release ▸
# Run workflow on main, with the version. The version must be the workspace version in
# Cargo.toml and its tag must not exist yet. The job builds Lastdrop-Setup.exe from main's
# commit (no cache), writes SHA256SUMS, installs and uninstalls it the way winget does, attests
# the build's provenance and creates a draft release whose tag v<version> points at that commit.
# A maintainer tests the draft and publishes it; publishing creates the tag (only repository
# admins may create v* tags: the "release tags" ruleset). Running Lastdrops only see published
# releases, and a published release cannot change (release immutability), so the files are
# uploaded while it is a draft.
#
# Without a version, or on a pull request that changes the installer or the release tooling,
# it is a dry run: build, checksums and the install test, with no attestation and no release.
#
# The release job runs in the "release" environment, which only main may deploy to. Code
# signing (SignPath) will be a step of the build job, before the checksums.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (empty: a dry run)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - packaging/**
      - crates/app/src/install.rs
      - crates/win/src/install.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test the installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The provenance attestation: a Sigstore certificate for this workflow run, and the
      # repository's attestation store.
      id-token: write
      attestations: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The tags too: the release's tag must not exist yet.
          fetch-depth: 0

      - name: Version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no workspace version in Cargo.toml"
            exit 1
          fi
          release=false
          if [ -n "$REQUESTED" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::a release is built from main (Run workflow ▸ Use workflow from: main), not $GITHUB_REF_NAME"
              exit 1
            fi
            if [ "$REQUESTED" != "$version" ]; then
              echo "::error::the version is $REQUESTED but Cargo.toml says $version: bump it first (a pull request)"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::the tag v$version exists already: that version is released"
              exit 1
            fi
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Lastdrop $version from $GITHUB_REF_NAME ($GITHUB_SHA); release: $release"

      # rust-toolchain.toml pins the version; with no toolchain named, rustup installs exactly
      # that. No rust-cache: a release is built from main's sources and nothing else.
      - name: Toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Release build
        run: cargo build --release -p lastdrop --locked

      # The installer is the app itself (updates-spec §2). SHA256SUMS in sha256sum format with
      # LF line ends, which the app's updater reads.
      - name: Installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\lastdrop.exe dist\Lastdrop-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 dist\Lastdrop-Setup.exe).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD\dist\SHA256SUMS", "$hash  Lastdrop-Setup.exe`n")
          Get-Content dist\SHA256SUMS

      # What winget runs (packaging/winget): --install --quiet, then the "Installed apps"
      # entry's QuietUninstallString. A fresh runner is a clean Windows user.
      - name: Install and uninstall test
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools\release\install-test.ps1 -Setup dist\Lastdrop-Setup.exe -Version $env:VERSION

      - name: Provenance attestation
        if: ${{ steps.version.outputs.release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Lastdrop-Setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/Lastdrop-Setup.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: draft release
    needs: build
    if: ${{ needs.build.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      # Create the draft release and upload its files.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # The tag does not exist yet: the draft names it and the commit that was built, and
      # GitHub creates it when the draft is published.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::a release $tag exists already (a draft from an earlier run?): delete it on GitHub, then run again"
            exit 1
          fi
          cat > notes.md <<EOF
          Download **Lastdrop-Setup.exe** and run it: it installs Lastdrop for your Windows user,
          without administrator rights, and updates itself from these releases. Or use winget:
          \`winget install 2Fivers.Lastdrop\`.

          \`SHA256SUMS\` lists the installer's checksum. GitHub's runners built it from ${tag}'s
          commit; to check that, run
          \`gh attestation verify Lastdrop-Setup.exe --repo ${GITHUB_REPOSITORY}\`.
          EOF
          gh release create "$tag" dist/Lastdrop-Setup.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Lastdrop $VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "Draft release $tag created from $GITHUB_SHA: test it, then publish it on GitHub (publishing creates the tag)." >> "$GITHUB_STEP_SUMMARY"
